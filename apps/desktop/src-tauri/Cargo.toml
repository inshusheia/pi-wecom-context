[package]
name = "wecom-context-desktop"
version = "1.0.0"
description = "Local WeCom Context desktop control panel"
authors = ["Yang Siyu"]
edition = "2021"

[lib]
name = "wecom_context_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
